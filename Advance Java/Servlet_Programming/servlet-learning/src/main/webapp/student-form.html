<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Student Registration</title>
</head>
<body>

<h2>Student Registration Form</h2>

<form action="students" method="post">

    <label>Student Name:</label>
    <input type="text"
           name="name"
           maxlength="100"
           required>

    <br><br>

    <label>Email:</label>
    <input type="email"
           name="email"
           maxlength="150"
           required>

    <br><br>

    <label>Course:</label>
    <input type="text"
           name="course"
           maxlength="100"
           required>

    <br><br>

    <button type="submit">
        Register Student
    </button>

</form>

<br>

<a href="students">View All Students</a>

</body>
</html>
